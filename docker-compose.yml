services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/gopher-pay    
      - gopherpay_bin:/gopher-pay/bin
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      db : 
        condition : service_healthy
    command: ["sh", "-c", "go build -o ./bin/api ./cmd/api && go build -o ./bin/migrate ./cmd/migrate && chmod +x ./bin/api ./bin/migrate && ./bin/migrate up && air"]
  db: 
    image: postgres:alpine
    environment:
      - POSTGRES_DB=gopherpay_db
      - POSTGRES_USER=gopherpay_user
      - POSTGRES_PASSWORD=gopherpay_pass
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gopherpay_user -d gopherpay_db"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    restart : always  
    volumes:
    - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  gopherpay_bin: